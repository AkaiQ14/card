<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>QG14 Card Clash</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
      /* ===== Copy feedback animation ===== */
      @keyframes copyPop {
        0%   { transform: scale(1); }
        30%  { transform: scale(0.96); }
        55%  { transform: scale(1.03); }
        100% { transform: scale(1); }
      }
      .copy-success {
        animation: copyPop 0.45s ease;
      }

      @keyframes checkDraw {
        0%   { stroke-dashoffset: 24; opacity: 0; }
        20%  { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }
      .copy-check path {
        stroke-dasharray: 24;
        stroke-dashoffset: 24;
        animation: checkDraw 0.5s ease forwards;
      }

      /* Toast */
      #copyToast {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%) translateY(12px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        z-index: 60;
      }
      #copyToast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* Ready badge */
      @keyframes badgeIn {
        0%   { opacity: 0; transform: scale(0.7) translateY(4px); }
        60%  { opacity: 1; transform: scale(1.08); }
        100% { opacity: 1; transform: scale(1); }
      }
      .ready-badge {
        animation: badgeIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      @keyframes readyPulseDot {
        0%, 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.55); }
        50%      { box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
      }
      .ready-dot {
        animation: readyPulseDot 1.8s ease-in-out infinite;
      }

      /* General professional polish */
      .btn-gradient {
        transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
      }
      .btn-gradient:hover:not(:disabled) {
        filter: brightness(1.05);
      }
      .btn-gradient:disabled {
        cursor: not-allowed;
      }
    </style>
  </head>
  <body class="bg-[#4B0E1F] bg-gradient-to-b from-[#4B0E1F] via-[#3a0b18] to-[#12040a] text-white min-h-screen p-6 flex flex-col items-center justify-center space-y-6">
    <!-- Copy confirmation toast -->
    <div id="copyToast">
      <div class="flex items-center gap-2 bg-black/80 backdrop-blur border border-emerald-500/50 text-emerald-300 px-5 py-2.5 rounded-full shadow-2xl shadow-black/40 text-sm font-bold">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 13l4 4L19 7" />
        </svg>
        <span id="copyToastText">تم نسخ الرابط بنجاح</span>
      </div>
    </div>
    <h1 class="text-4xl font-bold text-center">QG14 Card Clash</h1>

    <!-- Top-center timer + controls -->
    <div class="fixed top-3 inset-x-0 z-50 flex flex-col items-center space-y-2">
      <!-- Clickable timer to toggle between 02:00 and 00:30 (only when not running) -->
      <button
        id="countdownBox"
        class="bg-black/40 backdrop-blur px-4 py-1.5 rounded-full border border-yellow-600 focus:outline-none focus:ring-2 focus:ring-yellow-500 transition"
        title="اضغط للتبديل بين 2:00 و 0:30 (عند التوقف)"
      >
        <span id="countdown" class="font-mono text-2xl tracking-widest select-none">02:00</span>
      </button>

      <!-- Controls -->
      <div class="flex items-center gap-2">
        <button
          id="startTimerBtn"
          class="btn-gradient bg-yellow-500 hover:bg-yellow-600 px-5 py-2 rounded-xl text-base font-extrabold shadow-lg shadow-black/20"
        >
          ابدأ
        </button>
        <button
          id="pauseTimerBtn"
          class="btn-gradient bg-gray-200 hover:bg-white text-black px-5 py-2 rounded-xl text-base font-extrabold disabled:opacity-60 shadow-lg shadow-black/10"
          disabled
        >
          إيقاف
        </button>
      </div>
    </div>

    <img
      src="../images/qg14-Card-Clash-logo.png"
      alt="QG14 Logo"
      class="fixed bottom-4 right-4 w-40 h-auto opacity-90 pointer-events-none"
    />

    <!-- روابط النسخ + حالة الاستلام + بدء -->
    <div class="space-y-4 w-full max-w-md text-center">
      <div class="flex items-center justify-between gap-4">
        <button id="copyP1" class="btn-gradient relative flex-1 flex items-center justify-center gap-2 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 py-2.5 rounded-xl text-lg font-bold shadow-lg shadow-black/20 transition-transform active:scale-95">
          <svg class="copy-icon w-5 h-5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="2" />
            <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" />
          </svg>
          <span class="copy-label">نسخ رابط ترتيب البطاقات</span>
        </button>
        <span id="statusP1" class="ready-badge hidden items-center gap-1.5 bg-emerald-500/15 text-emerald-400 border border-emerald-500/40 px-3 py-1.5 rounded-full text-sm font-bold">
          <span class="ready-dot w-2 h-2 rounded-full bg-emerald-400"></span>
          جاهز
        </span>
      </div>

      <div class="flex items-center justify-between gap-4">
        <button id="copyP2" class="btn-gradient relative flex-1 flex items-center justify-center gap-2 bg-gradient-to-r from-indigo-600 to-sky-600 hover:from-indigo-700 hover:to-sky-700 py-2.5 rounded-xl text-lg font-bold shadow-lg shadow-black/20 transition-transform active:scale-95">
          <svg class="copy-icon w-5 h-5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="2" />
            <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" />
          </svg>
          <span class="copy-label">نسخ رابط ترتيب البطاقات</span>
        </button>
        <span id="statusP2" class="ready-badge hidden items-center gap-1.5 bg-emerald-500/15 text-emerald-400 border border-emerald-500/40 px-3 py-1.5 rounded-full text-sm font-bold">
          <span class="ready-dot w-2 h-2 rounded-full bg-emerald-400"></span>
          جاهز
        </span>
      </div>

      <button
        id="startBtn"
        class="btn-gradient w-full py-3 rounded-2xl text-xl font-extrabold bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 shadow-xl shadow-black/25 disabled:opacity-40 disabled:hover:scale-100"
        disabled
      >
        بدء المعركة
      </button>
    </div>

    <!-- قدرات اللاعبين (عرض فقط) -->
    <div class="w-full max-w-5xl mt-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- يمين: اللاعب الأول -->
        <div class="rounded-2xl p-6 border-2 border-yellow-700 bg-black/20 shadow-xl shadow-black/30">
          <div class="flex items-center justify-between text-base font-bold mb-2">
            <span id="p1NameBox">قدرات اللاعب الأول</span>
            <span class="opacity-70">عرض فقط</span>
          </div>
          <div id="p1AbilitiesView" class="space-y-4 min-h-10"></div>
        </div>

        <!-- يسار: اللاعب الثاني -->
        <div class="rounded-2xl p-6 border-2 border-yellow-700 bg-black/20 shadow-xl shadow-black/30">
          <div class="flex items-center justify-between text-base font-bold mb-2">
            <span id="p2NameBox">قدرات اللاعب الثاني</span>
            <span class="opacity-70">عرض فقط</span>
          </div>
          <div id="p2AbilitiesView" class="space-y-4 min-h-10"></div>
        </div>
      </div>
    </div>

    <script src="wait.js"></script>
    <script src="../copyright.js"></script>
    <script src="../security.js"></script>
  </body>
</html>
