<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>QG14 Card Clash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#4B0E1F;
      --bg2:#12040a;
      --gold:#FFD700;
    }
    body{font-family:"Cairo",system-ui,sans-serif}
    .bg-game{
      background:
        radial-gradient(900px 500px at 15% 10%, rgba(255,215,0,.10), transparent 60%),
        radial-gradient(900px 500px at 90% 0%, rgba(59,130,246,.14), transparent 55%),
        linear-gradient(180deg, var(--bg1), #2a0612 55%, var(--bg2));
      min-height:100vh;
    }
    .glass{
      background: rgba(0,0,0,.35);
      border:1px solid rgba(255,215,0,.25);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }
    /* Keep ultra-tight grid look while feeling premium */
    #boxGrid{gap:6px !important;}

    /* Modal animation */
    @keyframes popIn{
      from{opacity:0; transform: translateY(10px) scale(.98);}
      to{opacity:1; transform: translateY(0) scale(1);}
    }
    .modal-card{ animation: popIn .16s ease-out; }

    /* Same glass picker and scrollbar used by result category picker */
    .result-category-picker{
      position:relative;
      flex:1;
      min-width:0;
      z-index:30;
    }
    .result-category-trigger{
      width:100%;
      min-height:42px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:8px 12px;
      color:#fff;
      font-size:.875rem;
      font-weight:800;
      border:1.5px solid rgba(255,215,0,.7);
      border-radius:12px;
      background:rgba(255,255,255,.08);
      backdrop-filter:blur(14px) saturate(135%);
      -webkit-backdrop-filter:blur(14px) saturate(135%);
      box-shadow:0 8px 24px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.10);
      transition:.18s ease;
      cursor:pointer;
      outline:none;
    }
    .result-category-trigger:hover,
    .result-category-trigger.is-open{
      border-color:#FFD700;
      background:rgba(255,255,255,.13);
      box-shadow:0 10px 28px rgba(0,0,0,.25), 0 0 0 2px rgba(255,215,0,.08);
    }
    .result-category-trigger-text{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .result-category-chevron{
      flex:none;
      color:#FFD700;
      font-size:18px;
      line-height:1;
      transition:transform .18s ease;
    }
    .result-category-trigger.is-open .result-category-chevron{
      transform:rotate(180deg);
    }
    .result-category-menu{
      position:absolute;
      bottom:calc(100% + 7px);
      right:0;
      width:100%;
      min-width:190px;
      max-height:360px;
      overflow-y:auto;
      padding:6px;
      border:1px solid rgba(255,215,0,.55);
      border-radius:14px;
      background:rgba(48,10,24,.82);
      backdrop-filter:blur(20px) saturate(145%);
      -webkit-backdrop-filter:blur(20px) saturate(145%);
      box-shadow:0 18px 45px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.08);
      scrollbar-width:thin;
      scrollbar-color:rgba(255,215,0,.75) transparent;
    }
    .result-category-menu::-webkit-scrollbar{width:14px}
    .result-category-menu::-webkit-scrollbar-track{background:transparent}
    .result-category-menu::-webkit-scrollbar-thumb{
      background:rgba(255,215,0,.72);
      border-radius:999px;
    }
    .result-category-item{
      width:100%;
      min-height:38px;
      border-radius:10px;
      padding:7px 10px;
      color:#fff;
      text-align:right;
      font-size:.85rem;
      font-weight:800;
      background:transparent;
      border:1px solid transparent;
      transition:.15s ease;
      cursor:pointer;
    }
    .result-category-item:hover,
    .result-category-item:focus{
      background:rgba(255,215,0,.13);
      border-color:rgba(255,215,0,.35);
      color:#FFD700;
      outline:none;
    }
    .result-category-item.is-selected{
      color:#FFD700;
      background:rgba(255,215,0,.12);
    }
  </style>
</head>

<body class="bg-game text-white p-6 min-h-screen flex flex-col items-center space-y-5">
  <header class="w-full max-w-6xl text-center">
    <h1 class="text-3xl md:text-4xl font-black">
      QG14 <span class="text-yellow-300">Card Clash</span>
    </h1>
    <p id="instruction" class="mt-2 text-lg md:text-xl text-white/85">اللاعب ... اختر بطاقاتك</p>
  </header>

  <section class="glass w-full max-w-6xl rounded-3xl p-3 md:p-5">
    <div id="boxGrid" class="grid grid-cols-4 sm:grid-cols-5 w-full" dir="ltr">
      <!-- Boxes inserted via JS -->
    </div>
  </section>

  <!-- Buttons -->
  <div class="flex flex-col sm:flex-row gap-3 mt-2">
    <button id="randomBtn" onclick="randomSelect()"
      class="px-7 py-3 rounded-2xl font-black bg-sky-600 hover:bg-sky-700 shadow-xl shadow-black/25">
      عشوائي
    </button>

    <!-- ✅ NEW: Tactic button -->
    <button id="tacticBtn" onclick="openTacticModal()"
      class="px-7 py-3 rounded-2xl font-black bg-fuchsia-600 hover:bg-fuchsia-700 shadow-xl shadow-black/25">
      تكتيك
    </button>

    <button id="confirmBtn" onclick="confirmSelection()"
      class="px-7 py-3 rounded-2xl font-black bg-emerald-600 hover:bg-emerald-700 shadow-xl shadow-black/25 hidden">
      تأكيد الإختيارات
    </button>
  </div>

  <!-- ✅ NEW: Tactic Modal (UI only – functions are in pick.js) -->
  <div id="tacticModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
    <div class="glass modal-card w-full max-w-lg rounded-3xl p-5 md:p-6 bg-[#4B0E1F]/80 border border-yellow-300/20">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl md:text-2xl font-extrabold text-yellow-200">اختر تكتيك</h2>
        <button onclick="closeTacticModal()"
          class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 font-extrabold">
          ✕
        </button>
      </div>

      <label class="block text-sm mb-2 text-white/80">التكتيك:</label>
      <input id="tacticSelect" type="hidden" value="silver" />
      <div id="tacticPicker" class="result-category-picker">
        <button id="tacticPickerTrigger" type="button"
          class="result-category-trigger"
          aria-haspopup="listbox" aria-expanded="false">
          <span id="tacticPickerText" class="result-category-trigger-text">درج سلفر</span>
          <span class="result-category-chevron">⌄</span>
        </button>

        <div id="tacticPickerMenu" class="result-category-menu hidden" role="listbox">
          <button type="button" class="result-category-item is-selected" data-value="silver" role="option" aria-selected="true">درج سلفر</button>
          <button type="button" class="result-category-item" data-value="reverse" role="option" aria-selected="false">درج عكسي</button>
          <button type="button" class="result-category-item" data-value="visca_lama" role="option" aria-selected="false">فيسكا لمى</button>
          <button type="button" class="result-category-item" data-value="range1_11" role="option" aria-selected="false">من 1-11</button>
          <button type="button" class="result-category-item" data-value="range2_12" role="option" aria-selected="false">من 2-12</button>
          <button type="button" class="result-category-item" data-value="range3_13" role="option" aria-selected="false">من 3-13</button>
          <button type="button" class="result-category-item" data-value="range4_14" role="option" aria-selected="false">من 4-14</button>
          <button type="button" class="result-category-item" data-value="range5_15" role="option" aria-selected="false">من 5-15</button>
          <button type="button" class="result-category-item" data-value="range6_16" role="option" aria-selected="false">من 6-16</button>
          <button type="button" class="result-category-item" data-value="range7_17" role="option" aria-selected="false">من 7-17</button>
          <button type="button" class="result-category-item" data-value="range8_18" role="option" aria-selected="false">من 8-18</button>
          <button type="button" class="result-category-item" data-value="range9_19" role="option" aria-selected="false">من 9-19</button>
          <button type="button" class="result-category-item" data-value="range10_20" role="option" aria-selected="false">من 10-20</button>
          <button type="button" class="result-category-item" data-value="odds_plus_14" role="option" aria-selected="false">فردي و 14</button>
          <button type="button" class="result-category-item" data-value="evens_plus_random" role="option" aria-selected="false">زوجي + رقم عشوائي</button>
        </div>
      </div>

      <div class="flex gap-3 mt-5">
        <button onclick="applyTactic()"
          class="flex-1 px-5 py-3 rounded-2xl font-black bg-fuchsia-600 hover:bg-fuchsia-700 shadow-xl shadow-black/25">
          تطبيق
        </button>
        <button onclick="closeTacticModal()"
          class="flex-1 px-5 py-3 rounded-2xl font-black bg-white/10 hover:bg-white/20">
          إلغاء
        </button>
      </div>

      <p class="mt-4 text-sm text-white/75">
        ملاحظة: سيتم اختيار عدد الصناديق المطلوب من داخل مجموعة التكتيك فقط.
      </p>
    </div>
  </div>

  <img src="../images/qg14-Card-Clash-logo.png" alt="QG14 Logo"
    class="fixed bottom-4 right-4 w-36 md:w-40 h-auto opacity-90 pointer-events-none" />

  <script src="pick.js?v=tactic-picker-v1"></script>
  <script src="../copyright.js"></script>
  <script src="../security.js"></script>
</body>
</html>
