<!DOCTYPE html>
<html lang="ar" dir="rtl"
      oncontextmenu="return false"
      ondragstart="return false" ondrop="return false">

<head>
  <meta charset="UTF-8" />
  <title>QG14 Card Clash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#4B0E1F;
      --bg2:#12040a;
      --gold:#FFD700;
    }

    body{font-family:"Cairo",system-ui,sans-serif}

    .bg-game{
      background:
        radial-gradient(900px 500px at 15% 10%, rgba(255,215,0,.08), transparent 60%),
        radial-gradient(900px 500px at 85% 0%, rgba(16,185,129,.08), transparent 60%),
        linear-gradient(rgba(75,14,31,.22), rgba(18,4,10,.35)),
        url('../images/QG14Background.png') center center / cover fixed no-repeat,
        var(--bg2);
      min-height:100vh;
    }

    .glass{
      background: rgba(0,0,0,.35);
      border:1px solid rgba(255,215,0,.28);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }

    .btn{
      border-radius:18px;
      font-weight:900;
      transition:transform .08s ease, filter .12s ease;
    }
    .btn:active{transform:translateY(1px)}

    /* Block selection/drag */
    html, body, img, video {
      -webkit-user-select:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .nosave { position: relative; display: inline-block; }
    .nosave > .shield {
      position: absolute; inset: 0;
      background: transparent;
      pointer-events: auto;
    }
    .nosave img, .nosave video { pointer-events: none; }
  </style>

<style id="qg14-result-theme-sync">

/* =========================================================
   QG14 RESULT THEME SYNC
   Visual-only override. Layout / IDs / JS behavior unchanged.
   ========================================================= */
:root{
  --qgr-gold:#FFD700;
  --qgr-gold-soft:#ffe777;
  --qgr-green:#0b6e3f;
  --qgr-green-hover:#14824c;
  --qgr-wine:#4B0E1F;
  --qgr-wine-panel:#511522;
  --qgr-wine-soft:#7b2131;
  --qgr-wine-soft-hover:#8b2a3a;
  --qgr-deep:#180309;
  --qgr-line:rgba(255,215,0,.48);
  --qgr-line-soft:rgba(255,215,0,.24);
  --qgr-glass:rgba(18,3,9,.72);
  --qgr-glass-soft:rgba(75,14,31,.56);
  --qgr-text:#fff;
  --qgr-text-soft:rgba(255,255,255,.72);
}
html,body,button,input,textarea,select,option{
  font-family:"Cairo",Tahoma,Arial,sans-serif !important;
}
button,input,textarea,select{
  transition:background .15s ease,border-color .15s ease,transform .08s ease,box-shadow .15s ease,filter .15s ease;
}
input,textarea,select{
  color:#fff !important;
  background:rgba(0,0,0,.22) !important;
  border-color:rgba(255,215,0,.50) !important;
}
input:focus,textarea:focus,select:focus{
  outline:none !important;
  border-color:var(--qgr-gold) !important;
  box-shadow:0 0 0 3px rgba(255,215,0,.10) !important;
}
select option{
  color:#fff !important;
  background:#3b0c1b !important;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,215,0,.58);border-radius:999px}


body.bg-game,.bg-game{
  min-height:100vh !important;
  color:#fff !important;
  background:
    linear-gradient(rgba(75,14,31,.20),rgba(24,3,9,.33)),
    url('../images/QG14Background.png') center center / cover fixed no-repeat,
    var(--qgr-wine) !important;
}
.glass{
  background:rgba(81,21,34,.72) !important;
  border:2px solid rgba(255,215,0,.55) !important;
  backdrop-filter:blur(16px) saturate(125%) !important;
  -webkit-backdrop-filter:blur(16px) saturate(125%) !important;
  box-shadow:0 18px 45px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.06) !important;
}
.btn,
#continueBtn,
#okBtn,
#openPlayerViewBtn,
#chatSendBtn{
  color:var(--qgr-gold) !important;
  border:2px solid var(--qgr-gold) !important;
  border-radius:14px !important;
  background:var(--qgr-green) !important;
  box-shadow:0 2px 0 rgba(0,0,0,.30) !important;
  font-weight:800 !important;
}
.btn:hover,
#continueBtn:hover,
#okBtn:hover,
#openPlayerViewBtn:hover,
#chatSendBtn:hover{
  background:var(--qgr-green-hover) !important;
  filter:none !important;
}
#okBtn.bg-gray-600,
#okBtn[class*="gray"]{
  color:#fff !important;
  background:var(--qgr-wine-soft) !important;
}
#okBtn.bg-gray-600:hover,
#okBtn[class*="gray"]:hover{background:var(--qgr-wine-soft-hover) !important}
#cardGrid select{
  min-height:42px !important;
  border:1.5px solid rgba(255,215,0,.72) !important;
  border-radius:11px !important;
  background:rgba(81,21,34,.92) !important;
  color:#fff !important;
  font-weight:800 !important;
}
#playerAbilities > *,
#opponentAbilities > *,
#chatHistory > *{
  border-color:rgba(255,215,0,.32) !important;
}
h1,h2,h3,.text-yellow-300{color:var(--qgr-gold-soft) !important}

</style>

<style id="qg14-result-theme-refined-v2">

/* =========================================================
   QG14 RESULT THEME — REFINED V2
   Visual corrections only. No JS / IDs / game logic changes.
   ========================================================= */
:root{
  --qg-gold:#FFD700;
  --qg-gold-2:#ffe777;
  --qg-green:#0b6e3f;
  --qg-green-hover:#14824c;
  --qg-wine:#4B0E1F;
  --qg-wine-panel:#511522;
  --qg-wine-button:#7b2131;
  --qg-wine-button-hover:#8b2a3a;
  --qg-deep:#180309;
  --qg-blue:#0369a1;
  --qg-blue-hover:#0284c7;
  --qg-purple:#9333ea;
  --qg-pink:#db2777;
}
html,body,button,input,textarea,select,option{
  font-family:"Cairo",Tahoma,Arial,sans-serif !important;
}
button{outline:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  box-shadow:0 0 0 3px rgba(255,215,0,.13) !important;
}


/* ORDER — Result theme with semantic button colors. */
body.bg-game,.bg-game{
  background:
    linear-gradient(rgba(75,14,31,.20),rgba(24,3,9,.33)),
    url('../images/QG14Background.png') center center / cover fixed no-repeat,
    var(--qg-wine) !important;
}
.glass{
  background:rgba(81,21,34,.76) !important;
  border:2px solid rgba(255,215,0,.52) !important;
}
.btn{
  color:#fff !important;
  border:1.5px solid rgba(255,215,0,.55) !important;
  background:var(--qg-wine-button) !important;
  border-radius:14px !important;
}
.btn:hover{background:var(--qg-wine-button-hover) !important}
#continueBtn{
  color:var(--qg-gold) !important;
  border:2px solid var(--qg-gold) !important;
  background:var(--qg-green) !important;
}
#continueBtn:hover{background:var(--qg-green-hover) !important}
#okBtn{
  color:var(--qg-gold) !important;
  border:2px solid var(--qg-gold) !important;
  background:var(--qg-green) !important;
}
#okBtn:hover{background:var(--qg-green-hover) !important}
#okBtn.bg-gray-600,#okBtn[class*="bg-gray"]{
  color:#fff !important;
  background:var(--qg-wine-button) !important;
}
#okBtn.bg-gray-600:hover,#okBtn[class*="bg-gray"]:hover{background:var(--qg-wine-button-hover) !important}
#openPlayerViewBtn{
  color:#fff !important;
  background:linear-gradient(135deg,#075985,#2563eb) !important;
  border:2px solid var(--qg-gold) !important;
}
#openPlayerViewBtn:hover{background:linear-gradient(135deg,#0369a1,#3b82f6) !important}
#chatSendBtn{
  color:#211600 !important;
  background:linear-gradient(180deg,#ffe97a,#ddb200) !important;
  border:2px solid #fff0a5 !important;
}
#chatSendBtn:hover{background:linear-gradient(180deg,#fff09b,#e8c22e) !important}
#cardGrid select{
  color:#fff !important;
  background:#511522 !important;
  border:1.5px solid rgba(255,215,0,.66) !important;
}
#playerAbilities > button:not(:disabled),#opponentAbilities > div{
  border-radius:11px !important;
}

</style>
</head>

<body class="bg-game text-white min-h-screen p-6 flex flex-col items-center space-y-6">

  <!-- Title -->
  <header class="text-center">
    <h1 class="text-3xl md:text-4xl font-black">
      QG14 <span class="text-yellow-300">Card Clash</span>
    </h1>
  </header>

  <!-- Timer -->
  <div id="timerWrap" class="flex justify-center">
    <div class="glass px-4 py-2 rounded-full">
      <span id="playerCountdown"
            class="font-mono text-2xl tracking-widest select-none">
        02:00
      </span>
    </div>
  </div>

  <!-- Instruction -->
  <p id="instruction" class="text-xl text-center text-white/90 font-bold">
    اللاعب ... رتب البطاقات
  </p>

  <!-- Cards -->
  <div id="cardGrid"
       class="flex flex-wrap justify-center gap-6 w-full max-w-5xl mx-auto"></div>

  <!-- Your abilities -->
  <section id="abilitiesPanel"
           class="glass w-full max-w-5xl mx-auto mt-4 p-4 rounded-2xl">

    <p class="font-extrabold mb-2 text-yellow-300">
      قدراتك (اضغط لطلب استخدامها):
    </p>

    <div id="playerAbilities" class="flex flex-wrap gap-2"></div>

    <p id="abilityStatus" class="mt-2 text-sm opacity-80"></p>
  </section>

  <!-- Opponent abilities -->
  <section id="opponentAbilitiesPanel"
           class="glass w-full max-w-5xl mx-auto mt-4 p-4 rounded-2xl">

    <p class="font-extrabold mb-2 text-yellow-300">
      قدرات الخصم (عرض فقط):
    </p>

    <div id="opponentAbilities" class="flex flex-wrap gap-2"></div>
  </section>

  <!-- Continue -->
  <button
    id="continueBtn"
    onclick="submitPicks()"
    class="btn hidden px-10 py-3 text-lg
           bg-gradient-to-r from-sky-500 to-indigo-600
           hover:from-sky-600 hover:to-indigo-700
           shadow-xl shadow-black/30"
  >
    متابعة
  </button>

  <!-- OK -->
  <button
    id="okBtn"
    onclick="togglePlayerOk()"
    class="btn hidden px-10 py-3 text-lg
           bg-gradient-to-r from-emerald-500 to-teal-600
           hover:from-emerald-600 hover:to-teal-700
           shadow-xl shadow-black/30"
    style="margin-top:8px"
  >
    تمام
  </button>

  <!-- Live view -->
  <button
    id="openPlayerViewBtn"
    class="btn px-10 py-3 text-lg
           bg-yellow-400 hover:bg-yellow-500
           text-black shadow-xl shadow-black/30"
    style="margin-top:8px"
  >
    عرض الجولة المباشرة
  </button>

  <div id="embeddedPlayerWrap"
       class="hidden w-full max-w-5xl mx-auto mt-4">

    <iframe
      id="embeddedPlayerFrame"
      src=""
      class="w-full h-[600px] rounded-2xl border border-yellow-600/60"
      referrerpolicy="no-referrer">
    </iframe>
  </div>

  <!-- Chat -->
  <section id="chatPanel"
           class="glass w-full max-w-5xl mx-auto mt-4 p-4 rounded-2xl">

    <p class="font-extrabold mb-2 text-yellow-300">
      💬 رسالة للمضيف:
    </p>

    <div id="chatHistory"
         class="h-40 overflow-y-auto rounded-xl
                border border-yellow-700/60
                bg-black/20 p-2 text-sm space-y-1">
    </div>

    <div class="mt-3 flex gap-2">
      <input id="chatInput" type="text"
        class="flex-1 bg-black/20 border border-yellow-600/60
               rounded-xl px-3 py-2 outline-none
               focus:ring-2 focus:ring-yellow-500/50"
        placeholder="اكتب رسالتك هنا..."
        autocomplete="off" />

      <button id="chatSendBtn"
        class="btn bg-yellow-400 hover:bg-yellow-500
               text-black px-6 py-2 rounded-xl">
        إرسال
      </button>
    </div>

    <p id="chatStatus" class="mt-2 text-xs opacity-80"></p>
  </section>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/player-media-cdn.js?v=github-player-media-v2"></script>
  <script src="order.js?v=nosave-hardened"></script>
  <script src="../copyright.js"></script>

</body>
</html>
